<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajedrez UNViMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Jersey+20&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0F1E;
    --light:#f0d9b5;
    --dark:#b58863;
    --purple:#4b2d5c;
    --purple-2:#5a3670;
    --panel:#2a1a3a;
    --panel-dark:#140a24;
    --outline:#312525;
    --glass:rgba(231,122,247,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:#fff;
    font-family:'Jersey 15',monospace;
    font-size:22px;
    overflow:hidden;
  }
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
  .screen{position:fixed;inset:0 0 44px 0;display:none;align-items:center;justify-content:center;z-index:1;padding:16px}
  .screen.active{display:flex}

  /* ---------- Tablero ---------- */
  .board{
    --size:min(540px,88vw,72vh);
    width:var(--size);height:var(--size);
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    border-radius:14px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    user-select:none;
    transition:transform .5s ease;
  }
  .board.static{opacity:.9;pointer-events:none}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;
      font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',sans-serif;
      font-size:calc(var(--size)/8*.78);line-height:1}
  .sq.l{background:var(--light)}
  .sq.d{background:var(--dark)}
  .sq .c{position:absolute;font-family:'Jersey 15',monospace;font-size:13px;color:rgba(120,80,50,.8);opacity:.9}
  .sq .rk{top:2px;left:3px}
  .sq .fl{bottom:1px;right:3px}
  .piece{display:block;transition:transform .5s ease;paint-order:stroke fill}
  .piece.w{color:#e9e9e9;-webkit-text-stroke:2.5px #000}
  .piece.b{color:#000;-webkit-text-stroke:2px #000;text-shadow:0 0 0 #000}
  .board.flipped{transform:rotate(180deg)}
  .board.flipped .piece,.board.flipped .c{transform:rotate(180deg)}
  .board.flipped .c{display:none}

  /* ---------- Pantalla de inicio ---------- */
  #welcome .stage{position:relative;display:flex;align-items:center;justify-content:center}
  #welcome .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .bienvenido{
    font-family:'Jersey 15',monospace;font-size:clamp(26px,4vw,38px);
    color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;letter-spacing:1px;
  }
  .title{
    font-family:'Jersey 20',monospace;font-size:clamp(56px,10vw,104px);line-height:.95;
    color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill;
    text-shadow:6px 7px 0 rgba(0,0,0,.85),8px 10px 12px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  .glass-btn{
    font-family:'Jersey 15',monospace;
    text-transform:uppercase;letter-spacing:1px;
    color:#fff;-webkit-text-stroke:4px var(--outline);paint-order:stroke fill;
    background:linear-gradient(135deg,rgba(231,122,247,.38),rgba(231,122,247,.22));
    background-color:var(--glass);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:2px solid var(--outline);border-radius:8px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.35);
    cursor:pointer;transition:transform .15s,background-color .2s,box-shadow .2s;
  }
  .glass-btn:hover{transform:translateY(-2px);background-color:rgba(231,122,247,.45)}
  .glass-btn:active{transform:translateY(1px)}
  #btnNueva{font-size:clamp(30px,5vw,44px);padding:10px 30px;margin-top:6px}

  /* ---------- Marquesina ---------- */
  .marquee{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:5;overflow:hidden;
           background:rgba(12,15,30,.85);display:flex;align-items:center}
  .marquee-track{display:inline-flex;white-space:nowrap;animation:scroll 40s linear infinite;color:#b9b6c6;font-size:22px}
  .marquee-track span{padding-right:3ch}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .marquee:hover .marquee-track{animation-play-state:paused}

  /* ---------- Configuración ---------- */
  #config{gap:48px;flex-wrap:wrap}
  .panel{
    width:min(420px,92vw);padding:28px 22px 22px;border-radius:14px;
    background:linear-gradient(180deg,#34204a,#25163a);
    box-shadow:0 10px 40px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:22px;
  }
  .panel h1{font-family:'Jersey 20',monospace;font-weight:400;text-align:center;font-size:56px;
            -webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:3px 4px 0 rgba(0,0,0,.8)}
  .options{background:var(--panel-dark);border-radius:10px;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
  .group h3{font-weight:400;text-align:center;font-size:28px;margin-bottom:6px;
            -webkit-text-stroke:4px #000;paint-order:stroke fill}
  .row{display:flex;gap:6px;justify-content:center}
  .opt{
    flex:1;font-family:'Jersey 15',monospace;font-size:21px;color:#fff;
    -webkit-text-stroke:3px #000;paint-order:stroke fill;
    background:var(--purple);border:2px solid rgba(0,0,0,.35);border-radius:6px;
    padding:10px 4px;cursor:pointer;transition:all .2s;
  }
  .opt:hover{filter:brightness(1.2)}
  .opt.dim{opacity:.35;filter:grayscale(.4)}
  .opt.sel{opacity:1;filter:none;box-shadow:0 0 0 2px #fff6}
  .opt.facil{background:#5cb85c}
  .opt.medio{background:#d3d26a}
  .opt.dificil{background:#7a3030}
  .opt.blancas{background:#c9c9d2}
  .opt.negras{background:#0c0c10;border-color:#555}
  .opt.aleatorio{background:var(--purple)}
  .group.disabled{opacity:.3;pointer-events:none}
  .actions{display:flex;justify-content:space-between;align-items:center}
  .small-btn{
    font-family:'Jersey 15',monospace;font-size:24px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;
    background:var(--purple);border:2px solid rgba(0,0,0,.4);border-radius:6px;padding:8px 16px;cursor:pointer;transition:all .25s;
  }
  .small-btn:hover:not(:disabled){filter:brightness(1.25)}
  .small-btn:disabled{opacity:.3;cursor:not-allowed}
  #btnComenzar{transform:scale(.95)}
  #btnComenzar.ready{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

  .board-col{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:var(--w,min(540px,88vw,72vh))}
  .board-col{--w:min(540px,88vw,72vh)}
  .bar{display:flex;gap:16px;justify-content:space-between;align-items:center}
  .name{
    flex:1;font-family:'Jersey 15',monospace;font-size:30px;color:#fff;
    -webkit-text-stroke:4px #000;paint-order:stroke fill;
    background:var(--purple);border:2px solid rgba(0,0,0,.35);border-radius:6px;
    padding:4px 14px;min-width:0;outline:none;
  }
  input.name:not([readonly]){cursor:text;border-color:#e77af7}
  input.name:not([readonly]):focus{box-shadow:0 0 0 2px #e77af7aa}
  input.name[readonly]{cursor:default}
  .timer{
    font-size:32px;padding:4px 14px;background:var(--purple);border:2px solid rgba(0,0,0,.35);border-radius:6px;
    min-width:112px;text-align:center;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;
  }
  .timer.empty{color:#ff2a2a}
  .hint{text-align:center;color:#b9b6c6;font-size:18px;min-height:22px}

  /* ---------- Partida ---------- */
  #game{gap:40px;flex-wrap:wrap}
  .flag{
    font-size:28px;background:var(--purple);border:2px solid rgba(0,0,0,.35);border-radius:6px;
    padding:2px 28px;cursor:pointer;line-height:1.3;
  }
  .flag:hover{filter:brightness(1.3)}
  .moves-wrap{width:min(420px,92vw);height:min(400px,50vh);background:#3f2a52;border-radius:6px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .moves{height:100%;background:#12061f;border-radius:6px;padding:14px;overflow:auto;text-align:center;border:2px solid #0006}
  .moves h2{font-weight:400;font-size:24px;-webkit-text-stroke:3px #000;paint-order:stroke fill;margin-bottom:8px}
  .moves h3{font-weight:400;font-size:28px;-webkit-text-stroke:4px #000;paint-order:stroke fill}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<!-- ============ PANTALLA 1: INICIO ============ -->
<section id="welcome" class="screen active">
  <div class="stage">
    <div id="bgBoard"></div>
    <div class="overlay">
      <div class="bienvenido">¡Bienvenido!</div>
      <div class="title">Ajedrez UNViMe</div>
      <button class="glass-btn" id="btnNueva">Nueva partida</button>
    </div>
  </div>
</section>

<!-- ============ PANTALLA 2: CONFIGURACIÓN ============ -->
<section id="config" class="screen">
  <div class="panel">
    <h1>Ajedrez UNViMe</h1>
    <div class="options">
      <div class="group" data-key="mode">
        <h3>Modo de partida</h3>
        <div class="row">
          <button class="opt" data-v="jugador">vs Jugador</button>
          <button class="opt" data-v="stockfish">vs Stockfish</button>
          <button class="opt" data-v="unvime">vs ia unvime</button>
        </div>
      </div>
      <div class="group" data-key="diff">
        <h3>Nivel de dificultad</h3>
        <div class="row">
          <button class="opt facil" data-v="facil">Fácil</button>
          <button class="opt medio" data-v="medio">Medio</button>
          <button class="opt dificil" data-v="dificil">Difícil</button>
        </div>
      </div>
      <div class="group" data-key="color">
        <h3>Color de piezas</h3>
        <div class="row">
          <button class="opt blancas" data-v="w">Blancas</button>
          <button class="opt negras" data-v="b">Negras</button>
          <button class="opt aleatorio" data-v="r">Aleatorio</button>
        </div>
      </div>
      <div class="group" data-key="time">
        <h3>Tiempo de Partida</h3>
        <div class="row">
          <button class="opt" data-v="10">10 min</button>
          <button class="opt" data-v="15">15 min</button>
          <button class="opt" data-v="20">20 min</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="small-btn" id="btnVolver">⬅ VOLVER</button>
      <button class="small-btn" id="btnComenzar" disabled>COMENZAR ▶</button>
    </div>
  </div>

  <div class="board-col">
    <div class="bar">
      <input class="name" id="nameTop" value="Jugador 2" maxlength="14" readonly>
      <div class="timer empty" id="timerTop">00:00</div>
    </div>
    <div id="cfgBoard"></div>
    <div class="bar">
      <input class="name" id="nameBottom" value="Jugador 1" maxlength="14" readonly>
      <div class="timer empty" id="timerBottom">00:00</div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</section>

<!-- ============ PANTALLA 3: PARTIDA ============ -->
<section id="game" class="screen">
  <div class="board-col">
    <div class="bar">
      <div class="name" id="gNameTop">Jugador 1</div>
      <div class="flag" title="Rendirse" id="flagTop">🏳</div>
      <div class="timer" id="gTimerTop">10:00</div>
    </div>
    <div id="gameBoard"></div>
    <div class="bar">
      <div class="name" id="gNameBottom">Jugador 2</div>
      <div class="flag" title="Rendirse" id="flagBottom">🏳</div>
      <div class="timer" id="gTimerBottom">10:00</div>
    </div>
  </div>
  <div class="moves-wrap">
    <div class="moves">
      <h2 id="gTitle">Partida Jugador 1 vs. Jugador 2</h2>
      <h3>Movimientos</h3>
    </div>
  </div>
</section>

<!-- ============ MARQUESINA ============ -->
<div class="marquee" aria-label="Participantes del proyecto">
  <div class="marquee-track" id="marquee"></div>
</div>

<script>
/* ---------- Tablero (estático, estilo react-chessboard) ---------- */
const GLYPH = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎'};
const BACK = ['r','n','b','q','k','b','n','r'];
function buildBoard(host, {staticMode=false}={}){
  host.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'board' + (staticMode ? ' static' : '');
  for(let r=8;r>=1;r--){
    for(let f=0;f<8;f++){
      const sq = document.createElement('div');
      sq.className = 'sq ' + ((r+f)%2===0 ? 'd' : 'l');
      let piece=null,color=null;
      if(r===8){piece=BACK[f];color='b'}
      else if(r===7){piece='p';color='b'}
      else if(r===2){piece='p';color='w'}
      else if(r===1){piece=BACK[f];color='w'}
      if(f===0){const c=document.createElement('span');c.className='c rk';c.textContent=r;sq.appendChild(c)}
      if(r===1){const c=document.createElement('span');c.className='c fl';c.textContent='abcdefgh'[f];sq.appendChild(c)}
      if(piece){
        const p=document.createElement('span');
        p.className='piece '+color;
        p.textContent=GLYPH[piece];
        sq.appendChild(p);
      }
      el.appendChild(sq);
    }
  }
  host.appendChild(el);
  return el;
}

/* Tablero del fondo de bienvenida: sin jugabilidad, 90% de opacidad */
buildBoard(document.getElementById('bgBoard'), {staticMode:true});
const cfgBoardEl = buildBoard(document.getElementById('cfgBoard'));
cfgBoardEl.classList.add('static');
const gameBoardEl = buildBoard(document.getElementById('gameBoard'));
gameBoardEl.classList.add('static');
gameBoardEl.style.opacity = 1;

/* ---------- Navegación ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id));
}
document.getElementById('btnNueva').onclick = ()=>show('config');
document.getElementById('btnVolver').onclick = ()=>show('welcome');

/* ---------- Estado de configuración ---------- */
const state = {mode:null,diff:null,color:null,time:null};
const nameTop = document.getElementById('nameTop');
const nameBottom = document.getElementById('nameBottom');
const timerTop = document.getElementById('timerTop');
const timerBottom = document.getElementById('timerBottom');
const btnComenzar = document.getElementById('btnComenzar');
const hint = document.getElementById('hint');
const AI_NAMES = {stockfish:'Stockfish', unvime:'IA UNViMe'};
let p1Name='Jugador 1', p2Name='Jugador 2';

const fmt = m => String(m).padStart(2,'0')+':00';

function isComplete(){
  if(!state.mode||!state.color||!state.time) return false;
  if(state.mode!=='jugador' && !state.diff) return false;
  return true;
}

function refresh(){
  // Grupos: dificultad sólo aplica a modos con IA
  const diffGroup = document.querySelector('[data-key="diff"]');
  diffGroup.classList.toggle('disabled', state.mode==='jugador');

  // Marcar opciones
  document.querySelectorAll('.group').forEach(g=>{
    const key = g.dataset.key;
    const val = state[key];
    g.querySelectorAll('.opt').forEach(b=>{
      const sel = val && b.dataset.v===val;
      b.classList.toggle('sel', !!sel);
      b.classList.toggle('dim', !!val && !sel);
    });
  });

  // Nombres: editables sólo en modo vs Jugador
  const pvp = state.mode==='jugador';
  nameBottom.readOnly = !pvp;
  nameTop.readOnly = !pvp;
  if(pvp){ nameBottom.value=p1Name; nameTop.value=p2Name; }
  else {
    nameBottom.value = 'Jugador 1';
    nameTop.value = state.mode ? AI_NAMES[state.mode] : 'Jugador 2';
  }

  // Tablero: gira si se eligen negras
  cfgBoardEl.classList.toggle('flipped', state.color==='b');

  // Relojes
  const t = state.time ? fmt(state.time) : '00:00';
  [timerTop,timerBottom].forEach(e=>{e.textContent=t; e.classList.toggle('empty', !state.time)});

  // Botón comenzar
  const ok = isComplete();
  if(ok && btnComenzar.disabled) { btnComenzar.classList.remove('ready'); void btnComenzar.offsetWidth; btnComenzar.classList.add('ready'); }
  btnComenzar.disabled = !ok;

  // Ayuda
  const missing=[];
  if(!state.mode) missing.push('modo');
  if(state.mode && state.mode!=='jugador' && !state.diff) missing.push('dificultad');
  if(!state.color) missing.push('color');
  if(!state.time) missing.push('tiempo');
  hint.textContent = ok ? '' : (missing.length? 'Falta elegir: '+missing.join(', ') : '');
}

document.querySelectorAll('.group .opt').forEach(b=>{
  b.addEventListener('click', ()=>{
    const key = b.closest('.group').dataset.key;
    state[key] = b.dataset.v;
    if(key==='mode' && b.dataset.v==='jugador') state.diff = null;
    refresh();
  });
});
nameBottom.addEventListener('input', ()=>{ if(state.mode==='jugador') p1Name = nameBottom.value || 'Jugador 1'; });
nameTop.addEventListener('input', ()=>{ if(state.mode==='jugador') p2Name = nameTop.value || 'Jugador 2'; });

/* ---------- Comenzar partida ---------- */
btnComenzar.onclick = ()=>{
  if(!isComplete()) return;
  let color = state.color;
  if(color==='r') color = Math.random()<.5 ? 'w' : 'b';
  const n1 = state.mode==='jugador' ? (p1Name||'Jugador 1') : 'Jugador 1';
  const n2 = state.mode==='jugador' ? (p2Name||'Jugador 2') : AI_NAMES[state.mode];
  document.getElementById('gNameBottom').textContent = n1;
  document.getElementById('gNameTop').textContent = n2;
  document.getElementById('gTitle').textContent = `Partida ${n1} vs. ${n2}`;
  const t = fmt(state.time);
  document.getElementById('gTimerTop').textContent = t;
  document.getElementById('gTimerBottom').textContent = t;
  gameBoardEl.classList.toggle('flipped', color==='b');
  show('game');
};
['flagTop','flagBottom'].forEach(id=>{
  document.getElementById(id).onclick = ()=>{
    if(confirm('¿Seguro que querés rendirte?')) show('welcome');
  };
});

refresh();

/* ---------- Marquesina de participantes (placeholder) ---------- */
const placeholder = 'Rol: nombre, nombre, nombre.';
const unit = Array(6).fill(placeholder).map(t=>`<span>${t}</span>`).join('');
document.getElementById('marquee').innerHTML = unit + unit; // x2 para loop continuo

/* ---------- Partículas flotantes ---------- */
(function(){
  const cv = document.getElementById('particles'), ctx = cv.getContext('2d');
  let W,H,dots=[];
  function resize(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.round(W*H/16000);
    dots = Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2.2+.6,
      vx:(Math.random()-.5)*.25, vy:-(Math.random()*.35+.1),
      a:Math.random()*.5+.15,
      c:Math.random()<.5?'231,122,247':'160,170,255',
      ph:Math.random()*6.28
    }));
  }
  addEventListener('resize',resize); resize();
  function tick(t){
    ctx.clearRect(0,0,W,H);
    for(const d of dots){
      d.x += d.vx + Math.sin(t/1800+d.ph)*.15;
      d.y += d.vy;
      if(d.y<-10){d.y=H+10;d.x=Math.random()*W}
      if(d.x<-10)d.x=W+10; if(d.x>W+10)d.x=-10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${d.c},${d.a*(0.7+0.3*Math.sin(t/900+d.ph))})`;
      ctx.arc(d.x,d.y,d.r,0,6.283);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
